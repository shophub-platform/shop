server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — sve nepoznate rute vrati na index.html.
    # (/api ne stiže ovdje: Ingress ruta /api ide direktno na backend servis.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
